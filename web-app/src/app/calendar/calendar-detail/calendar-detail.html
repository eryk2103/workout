<div class="flex flex-col gap-4 p-4">
  <a
    routerLink="/calendar"
    class="flex items-center gap-1 text-sm font-medium text-blue-600"
    aria-label="Back to calendar"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
    </svg>
    Calendar
  </a>

  <div class="flex items-start justify-between">
    <div>
      <p class="text-sm font-medium text-gray-400">{{ displayDate().weekday }}</p>
      <h1 class="text-2xl font-bold text-gray-900">{{ displayDate().dayMonth }}</h1>
    </div>
    <button
      type="button"
      (click)="modalOpen.set(true)"
      class="flex items-center gap-1.5 rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
      aria-label="Add workout"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      Add
    </button>
  </div>

  <ul aria-label="Schedule">
    @for (slot of timeSlots; track slot.time) {
      <li class="flex items-start gap-3 border-b border-gray-100 py-3 last:border-0">
        <span class="w-14 shrink-0 pt-0.5 text-sm text-gray-400">{{ slot.time }}</span>
        <div class="flex-1 rounded-lg bg-blue-50 px-3 py-2 text-sm font-medium text-blue-700">
          {{ slot.workout }}
        </div>
      </li>
    }
  </ul>
</div>

@if (modalOpen()) {
  <div
    class="fixed inset-0 z-40 bg-black/50"
    (click)="modalOpen.set(false)"
    aria-hidden="true"
  ></div>

  <div
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    class="fixed inset-x-4 top-1/2 z-50 flex max-h-[75vh] -translate-y-1/2 flex-col gap-4 rounded-2xl bg-white p-4 shadow-xl"
  >
    <div class="flex items-center justify-between">
      <h2 id="modal-title" class="text-lg font-semibold text-gray-900">Add Workout</h2>
      <button
        type="button"
        (click)="modalOpen.set(false)"
        class="flex size-8 items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
        aria-label="Close modal"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <app-search placeholder="Search workouts..." />

    <ul class="flex flex-col gap-2 overflow-y-auto" aria-label="Available workouts">
      @for (workout of availableWorkouts; track workout) {
        <li>
          <button
            type="button"
            (click)="selectWorkout(workout)"
            class="flex w-full items-center gap-3 rounded-xl bg-gray-50 px-4 py-3 text-left text-sm font-medium text-gray-900 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <span class="flex size-9 shrink-0 items-center justify-center rounded-full bg-blue-50 text-blue-600">
              <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
              </svg>
            </span>
            {{ workout }}
          </button>
        </li>
      }
    </ul>
  </div>
}
