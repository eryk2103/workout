<form [formGroup]="form">
  <div class="flex flex-col gap-1.5">
    <label for="name" class="text-sm font-medium text-gray-700">Name <span class="text-red-500" aria-hidden="true">*</span></label>
    <input
      id="name"
      type="text"
      formControlName="name"
      placeholder="e.g. Bench Press"
      class="rounded-xl border border-gray-200 bg-gray-50 px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
    />
  </div>
</form>
