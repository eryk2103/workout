<div class="flex flex-col h-screen bg-gray-50">
  <main class="flex-1 overflow-y-auto pb-16">
    <router-outlet />
  </main>

  <nav
    class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200"
    aria-label="Main navigation"
  >
    <div class="flex">
      <a
        routerLink="/calendar"
        routerLinkActive
        #calendarRla="routerLinkActive"
        [class.text-blue-600]="calendarRla.isActive"
        [class.text-gray-400]="!calendarRla.isActive"
        class="flex flex-col items-center flex-1 py-3 gap-1 text-xs font-medium"
        ariaCurrentWhenActive="page"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
        </svg>
        <span>Calendar</span>
      </a>

      <a
        routerLink="/workouts"
        routerLinkActive
        #workoutsRla="routerLinkActive"
        [class.text-blue-600]="workoutsRla.isActive"
        [class.text-gray-400]="!workoutsRla.isActive"
        class="flex flex-col items-center flex-1 py-3 gap-1 text-xs font-medium"
        ariaCurrentWhenActive="page"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
        </svg>
        <span>Workouts</span>
      </a>

      <a
        routerLink="/exercises"
        routerLinkActive
        #exercisesRla="routerLinkActive"
        [class.text-blue-600]="exercisesRla.isActive"
        [class.text-gray-400]="!exercisesRla.isActive"
        class="flex flex-col items-center flex-1 py-3 gap-1 text-xs font-medium"
        ariaCurrentWhenActive="page"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0z" />
        </svg>
        <span>Exercises</span>
      </a>
    </div>
  </nav>
</div>
